<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E9272C">
<meta name="apple-mobile-web-app-title" content="工地导航">
<title>佳安工地导航</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>

<style>
/* JIA AN 视觉规范：主品牌红 #E9272C、文字黑 #111111、分隔灰 #888888
   品牌红只用于动作与标识；状态另用石墨／琥珀，并叠加纹理，不靠颜色单一编码。 */
:root{
  --brand:#E9272C; --brand-ink:#C4161B;
  --ground:#F6F7F9; --surface:#FFFFFF; --surface-2:#F1F3F6;
  --ink:#111111; --ink-soft:#5E6367; --ink-faint:#8C9296;
  --rule:#E1E4E8; --rule-soft:#EDEFF2;
  --settled:#2E3438; --settled-bg:#ECEEF0;
  --pending:#B4620F; --pending-bg:#FBEEDF;
  --shadow:0 1px 2px rgba(17,17,17,.05), 0 4px 14px rgba(17,17,17,.05);
  --cjk:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,var(--cjk);
  --disp:"Archivo",-apple-system,"Helvetica Neue",Arial,var(--cjk);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --tap:48px;
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --brand:#FF5054; --brand-ink:#FF7376;
    --ground:#111214; --surface:#1A1C1F; --surface-2:#212429;
    --ink:#EDEEEF; --ink-soft:#A0A6AA; --ink-faint:#767C81;
    --rule:#2A2E33; --rule-soft:#22262A;
    --settled:#C3CACE; --settled-bg:#262A2E;
    --pending:#E0953F; --pending-bg:#2E2415;
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 4px 14px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --brand:#FF5054; --brand-ink:#FF7376;
  --ground:#111214; --surface:#1A1C1F; --surface-2:#212429;
  --ink:#EDEEEF; --ink-soft:#A0A6AA; --ink-faint:#767C81;
  --rule:#2A2E33; --rule-soft:#22262A;
  --settled:#C3CACE; --settled-bg:#262A2E;
  --pending:#E0953F; --pending-bg:#2E2415;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 4px 14px rgba(0,0,0,.35);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%; overflow-x:hidden}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:var(--sans);font-size:17px;line-height:1.47;
  overflow-x:hidden;             /* 兜底：任何意外宽元素都不许把页面拉出去晃 */
  -webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;
  padding:0 max(16px,var(--safe-l)) calc(88px + var(--safe-b)) max(16px,var(--safe-r))}

/* ── 页眉：logo + 红细线，品牌只出现在这里和动作上 ── */
.masthead{display:flex;align-items:center;gap:14px;padding:14px 0 6px}
.masthead img{width:52px;height:52px;flex:none}
.masthead .t{min-width:0}
h1{font-family:var(--disp);font-size:34px;font-weight:700;letter-spacing:-.022em;
  margin:0;line-height:1.08}
.eyebrow{font-family:var(--disp);font-size:11px;font-weight:600;letter-spacing:.18em;
  text-transform:uppercase;color:var(--brand);margin:0 0 4px}
.sub{margin:14px 0 0;font-size:15px;line-height:1.42;color:var(--ink-soft);max-width:54ch;
  padding-top:13px;border-top:2px solid var(--brand)}

/* ── 控制条 ── */
.controls{position:sticky;top:0;z-index:600;
  background:var(--ground);padding:11px 0 12px;
  border-bottom:1px solid var(--rule-soft);
  display:flex;flex-direction:column;gap:8px}
.search{width:100%;height:52px;padding:0 16px;
  font:400 17px/1 var(--sans);color:var(--ink);
  background:var(--surface);border:1px solid var(--rule);border-radius:12px}
.search::placeholder{color:var(--ink-faint)}
.search:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:transparent}
/* iOS 分段控件：一整块底，选中项是里面滑动的白片 */
.filters{display:flex;gap:3px;padding:3px;background:var(--surface-2);
  border-radius:11px;border:1px solid var(--rule)}
.chip{flex:1;min-height:44px;font:590 15px/1.15 var(--sans);
  padding:5px 3px;color:var(--ink-soft);
  background:transparent;border:0;border-radius:9px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  -webkit-tap-highlight-color:transparent}
.chip:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.chip[aria-pressed="true"]{background:var(--surface);color:var(--ink);
  box-shadow:0 1px 3px rgba(17,17,17,.14)}
.chip .n{font-family:var(--mono);font-size:12px;opacity:.6;font-variant-numeric:tabular-nums}

/* ── 地图 ── */
.mapwrap{margin:13px 0 0;position:relative}
#map{height:clamp(340px,52vh,520px);border-radius:14px;
  border:1px solid var(--rule);box-shadow:var(--shadow);
  background:var(--surface-2);z-index:1}
.mapbar{display:flex;gap:7px;margin-top:8px}
.mapbtn{flex:1;min-height:52px;display:flex;align-items:center;justify-content:center;gap:9px;
  font:590 16px/1 var(--sans);color:var(--ink);
  background:var(--surface);border:1px solid var(--rule);border-radius:12px;cursor:pointer;
  -webkit-tap-highlight-color:transparent}
.mapbtn:active{background:var(--surface-2)}
.mapbtn:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.mapbtn svg{width:21px;height:21px}
.mapbtn.on{background:var(--ink);color:var(--ground);border-color:var(--ink)}
body.mapfull{overflow:hidden}
body.mapfull .mapwrap{position:fixed;inset:0;z-index:900;margin:0;
  background:var(--ground);display:flex;flex-direction:column;
  padding:max(10px,env(safe-area-inset-top,0px)) 10px calc(10px + var(--safe-b))}
body.mapfull #map{flex:1;height:auto;border-radius:10px}
body.mapfull .mapbar{margin-top:8px}
.leaflet-container{font-family:var(--sans);background:var(--surface-2)}
.leaflet-control-zoom a{width:46px!important;height:46px!important;line-height:46px!important;
  font-size:22px!important}
.pin{width:26px;height:26px;border-radius:50%;border:3.5px solid #fff;
  box-shadow:0 1px 6px rgba(0,0,0,.45);margin:11px}
.pin.settled{background:#2E3438}
.pin.pending{background:#fff;border-color:#B4620F;
  box-shadow:0 0 0 3px #fff,0 1px 5px rgba(0,0,0,.45)}
.pin.pending::after{content:"";display:block;width:11px;height:11px;margin:4px;
  border-radius:50%;background:#B4620F}
.me{width:20px;height:20px;border-radius:50%;background:#E9272C;
  border:4px solid #fff;box-shadow:0 1px 7px rgba(0,0,0,.5);margin:14px}
.pop{font-family:var(--sans)}
.pop b{font-size:17px;color:#111}
.pop .m{color:#5E6367;font-size:14px;display:block;margin:3px 0 7px}
.pop a{display:inline-block;background:#E9272C;color:#fff!important;text-decoration:none;
  font-weight:600;font-size:15px;padding:11px 18px;border-radius:10px;min-height:44px;
  box-sizing:border-box;line-height:22px}

/* ── 分区与条目 ── */
.region{margin:24px 0 0}
.region-head{display:flex;align-items:baseline;gap:9px;padding:0 2px 7px;
  border-bottom:1px solid var(--rule);margin-bottom:9px}
.region-head h2{font-family:var(--disp);font-size:17px;font-weight:700;
  letter-spacing:.02em;margin:0}
.region-head .cnt{font-family:var(--mono);font-size:13px;color:var(--ink-faint);
  font-variant-numeric:tabular-nums}

.list{display:flex;flex-direction:column;gap:8px}
.site{display:grid;grid-template-columns:7px 1fr auto;align-items:stretch;min-height:76px;
  background:var(--surface);border:1px solid var(--rule);border-radius:14px;
  box-shadow:var(--shadow);overflow:hidden;scroll-margin-top:140px}
.site.hi{outline:2px solid var(--brand);outline-offset:1px}
.stripe{background:var(--settled)}
.site.warn .stripe{
  background:repeating-linear-gradient(135deg,
    var(--pending) 0 3px, transparent 3px 6px), var(--pending-bg)}
.body{padding:14px 8px 14px 15px;min-width:0}
.line1{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.name{font-size:19px;font-weight:600;letter-spacing:-.014em;line-height:1.2}
.badge{font-family:var(--disp);font-size:12px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;padding:4px 9px;border-radius:6px;
  background:var(--settled-bg);color:var(--settled);white-space:nowrap}
.site.warn .badge{background:var(--pending-bg);color:var(--pending)}
.addr{margin-top:5px;font-size:15px;line-height:1.34;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.client{margin-top:3px;font-size:13.5px;color:var(--ink-faint);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.coord{margin-top:7px;font-family:var(--mono);font-size:13px;color:var(--ink-faint);
  font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.coord .dist{color:var(--brand);font-weight:500}
.note{margin-top:10px;padding:9px 12px;background:var(--pending-bg);border-radius:9px;
  font-size:14px;line-height:1.42;color:var(--pending)}

.actions{display:flex;align-items:stretch;border-left:1px solid var(--rule-soft)}
.go,.copy{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  border:0;background:transparent;cursor:pointer;text-decoration:none;
  min-width:68px;-webkit-tap-highlight-color:transparent}
.go{color:var(--brand);font:700 14px/1 var(--sans);padding:0 12px}
.go svg{width:28px;height:28px}
.copy{border-left:1px solid var(--rule-soft);color:var(--ink-soft);
  font:500 13px/1 var(--sans);padding:0 11px}
.copy svg{width:23px;height:23px}
.go:active,.copy:active{background:var(--surface-2)}
.go:focus-visible,.copy:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.copy.done{color:var(--settled)}

.callout{margin:10px 0 0;padding:13px 15px;background:var(--surface-2);
  border-left:4px solid var(--pending);border-radius:0 10px 10px 0;
  font-size:14px;line-height:1.5;color:var(--ink-soft)}
.callout b{color:var(--ink);font-weight:600}
.empty{padding:40px 4px;text-align:center;color:var(--ink-faint);font-size:16px}
.empty[hidden]{display:none}

footer{margin-top:32px;padding-top:16px;border-top:2px solid var(--brand);
  font-size:14px;color:var(--ink-faint);line-height:1.6}
footer a{color:var(--brand)}
footer p{margin:0 0 7px}
.legend{display:flex;gap:16px;margin:0 0 12px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:7px}
.key{width:14px;height:14px;border-radius:4px;background:var(--settled);flex:none}
.key.w{background:repeating-linear-gradient(135deg,
  var(--pending) 0 3px, transparent 3px 6px), var(--pending-bg)}

@media (max-width:390px){
  h1{font-size:30px}
  .masthead img{width:46px;height:46px}
  .body{padding:13px 5px 13px 13px}
  .go,.copy{min-width:60px;padding:0 8px}
  .name{font-size:18px}
  .chip{font-size:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

/** 直线距离（公里）。不是行车距离，只用来排就近顺序。 */
function km(aLat, aLng, bLat, bLng){
  const R = 6371, r = Math.PI / 180;
  const dp = (bLat - aLat) * r, dl = (bLng - aLng) * r;
  const h = Math.sin(dp/2)**2 + Math.cos(aLat*r) * Math.cos(bLat*r) * Math.sin(dl/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

  if (!q) return true;
  return (s.name+' '+s.client+' '+s.address+' '+s.region+' '+s.id).toLowerCase().includes(q);
}

function render(){

      hits.some(o => o !== h && o.lat === h.lat && o.lng === h.lng)).length;
    const note = stacked > 2
      ? `<div class="callout"><b>${stacked} 个标段共用一个坐标。</b>同在一个厂区，导航只能带到厂区，进场后需认标段。</div>`
      : '';
    return `<section class="region">
      <div class="region-head"><h2>${esc(rg)}</h2><span class="cnt">${hits.length}</span></div>
      <div class="list">${hits.map(card).join('')}</div>
      ${note}
    </section>`;
  }).join('');
  emptyEl.hidden = shown > 0;
  window.__CURRENT__ = visible;
  if (window.syncMap) window.syncMap(visible);
}

    filter = btn.dataset.f;
    document.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
    render();
  });
});

listEl.addEventListener('click', async e => {
  const btn = e.target.closest('.copy');
  if (!btn) return;
  try { await navigator.clipboard.writeText(btn.dataset.coord); }
  catch {
    const ta = document.createElement('textarea');
    ta.value = btn.dataset.coord;
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
  }
  const was = btn.innerHTML;
  btn.classList.add('done');
  btn.innerHTML = ICON_COPY + '已复制';
  setTimeout(() => { btn.classList.remove('done'); btn.innerHTML = was; }, 1400);
});

window.setMyLocation = (lat, lng) => { me = [lat, lng]; render(); };
render();
</script>
<script>
window.addEventListener('load', () => {
  const mapEl = document.getElementById('map');
  if (typeof L === 'undefined' || !mapEl) {
    // 没信号或瓦片被挡时，整块地图移除，列表和导航照常可用
    const w = document.querySelector('.mapwrap'); if (w) w.remove(); return;
  }
  const map = L.map('map', {scrollWheelZoom:false, zoomControl:false, tap:true});
  L.control.zoom({position:'bottomright'}).addTo(map);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18, attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  const layer = L.layerGroup().addTo(map);
  let meMarker = null;
  // 44px 命中区包一个 20px 的点——手指点得到，视觉上仍然是小圆点
  const pin = ok => L.divIcon({
    className: '', iconSize: [44,44], iconAnchor: [22,22], popupAnchor: [0,-14],
    html: `<div class="pin ${ok ? 'settled' : 'pending'}"></div>`
  });

  window.syncMap = (sites) => {
    layer.clearLayers();
    const pts = [];
    const seen = {};
    sites.forEach(s => {
      // 同坐标的点原样叠在一起就只点得到一个，散开一点点（仅显示偏移，数据不动）
      const key = s.lat + ',' + s.lng;
      const n = (seen[key] = (seen[key] || 0) + 1) - 1;
      const ang = n * (Math.PI / 3), r = n ? 0.0022 : 0;
      const ll = [s.lat + r * Math.cos(ang), s.lng + r * Math.sin(ang)];
      pts.push(ll);
      L.marker(ll, {icon: pin(s.confirmed), title: s.name, riseOnHover: true})
        .bindPopup(`<div class="pop"><b>${s.name}</b>
           <span class="m">${s.client}<br>${s.address}</span>
           <a href="https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}"
              target="_blank" rel="noopener">导航</a></div>`)
        .on('click', () => {
          const el = document.getElementById('s-' + s.id);
          if (!el) return;
          document.querySelectorAll('.site.hi').forEach(x => x.classList.remove('hi'));
          el.classList.add('hi');
          if (!document.body.classList.contains('mapfull'))
            el.scrollIntoView({behavior:'smooth', block:'center'});
        })
        .addTo(layer);
    });
    
    if (meMarker) { meMarker.addTo(layer); pts.push(meMarker.getLatLng()); }
    if (pts.length) map.fitBounds(L.latLngBounds(pts), {padding:[26,26], maxZoom:15});
  };

  document.getElementById('mapfull').addEventListener('click', e => {
    const on = document.body.classList.toggle('mapfull');
    e.currentTarget.classList.toggle('on', on);
    e.currentTarget.querySelector('span').textContent = on ? '退出全屏' : '放大地图';
    setTimeout(() => map.invalidateSize(), 120);
  });

  document.getElementById('maploc').addEventListener('click', e => {
    const btn = e.currentTarget, label = btn.querySelector('span');
    if (!navigator.geolocation) { label.textContent = '设备不支持定位'; return; }
    label.textContent = '定位中…';
    navigator.geolocation.getCurrentPosition(pos => {
      const {latitude:lat, longitude:lng} = pos.coords;
      if (meMarker) layer.removeLayer(meMarker);
      meMarker = L.marker([lat,lng], {icon: L.divIcon({
        className:'', iconSize:[44,44], iconAnchor:[22,22], html:'<div class="me"></div>'
      }), title:'我'});
      btn.classList.add('on');
      label.textContent = '已定位';
      window.setMyLocation(lat, lng);          // 列表每条补上「距我 x.x km」
    }, () => { label.textContent = '定位失败'; btn.classList.remove('on');
               setTimeout(() => label.textContent = '我的位置', 2200); },
       {enableHighAccuracy:true, timeout:9000});
  });

  window.syncMap(window.__CURRENT__ || DATA.sites);
});
</script>
